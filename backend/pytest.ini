[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning:joblib.*
    ignore::DeprecationWarning:numpy.*
    ignore::UserWarning:shap.*
    ignore::FutureWarning:google.generativeai.*
    ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning
