version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broker_insight}
      POSTGRES_USER: ${POSTGRES_USER:-broker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broker_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-broker_user} -d ${POSTGRES_DB:-broker_insight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-broker_user}:${POSTGRES_PASSWORD:-broker_pass}@db:5432/${POSTGRES_DB:-broker_insight}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ml_artifacts:/app/app/ml/artifacts
    command: >
      sh -c "alembic upgrade head &&
             python -m app.ml.generate_data &&
             python -m app.ml.train_model &&
             python -m app.core.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── Next.js Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  ml_artifacts:
